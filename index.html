      font-size: 0.85rem;
      min-width: 1200px;
    }

    th {
      background: #1a3a57;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;

      letter-spacing: 0.4px;
      padding: 14px 10px;
      text-align: left;
      white-space: nowrap;
      border-right: 1px solid #2d5170;

    }

      vertical-align: top;
      color: #173e5e;
      background: white;

      border-bottom: none;
    }

    .provider-type {
      font-weight: 600;
      color: #0b3a60;
      white-space: nowrap;
    }

      background: #e1edf9;

      font-weight: 600;

  // Table columns (order matches display)
  const columns = [
    { key: 'providerType', label: 'PROVIDER TYPE' },
    { key: 'emirates', label: 'EMIRATES' },
    { key: 'area', label: 'AREA' },
    { key: 'name', label: 'NAME OF THE PROVIDER' },
    { key: 'location', label: 'LOCATION' },
    { key: 'contact', label: 'CONTACT NUMBER' },
    { key: 'pobox', label: 'PO.BOX' },
    { key: 'facilities', label: 'FACILITIES/SPECIALTIES' },
    { key: 'haNo', label: 'HA REG NO' }
  ];

  // DOM elements
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const tableContainer = document.getElementById('tableContainer');
  const resultStats = document.getElementById('resultStats');

  // Helper: safe string conversion, empty for null/undefined
  function safe(val) {
    return (val === null || val === undefined) ? '' : String(val);
  }

  // Function to render the table for a given array of items
  function renderTable(items) {
    // Update stats
    resultStats.textContent = `${items.length} provider${items.length !== 1 ? 's' : ''}`;

    if (items.length === 0) {
      tableContainer.innerHTML = `<div class="no-results"><span>🔍</span> No providers match your search. Try a different keyword.</div>`;
      return;
    }

    // Build table HTML
    let html = `<table>
      <thead>
        <tr>
          ${columns.map(col => `<th>${col.label}</th>`).join('')}
        </tr>
      </thead>
      <tbody>`;

    items.forEach(row => {
      html += '<tr>';
      columns.forEach(col => {
        let cellValue = safe(row[col.key]);
        // Optional: beautify HA number display, but we keep as is
        if (col.key === 'haNo' && cellValue) {
          cellValue = `<span class="ha-no">${cellValue}</span>`;
        } else if (col.key === 'providerType') {
          cellValue = `<span class="provider-type">${cellValue}</span>`;
        } else if (col.key === 'facilities' && cellValue.trim() !== '') {
          // Lightly style facility list
          cellValue = `<span class="facility-badge">${cellValue}</span>`;
        }
        html += `<td>${cellValue}</td>`;
      });
      html += '</tr>';
    });

    html += `</tbody></table>`;
    tableContainer.innerHTML = html;
  }

  // Filter function: search across all keys of each item
  function filterData(query) {
    if (!query.trim()) {
      renderTable(providerData);
      return;
    }

    const lowerQuery = query.trim().toLowerCase();

    const filtered = providerData.filter(item => {
      // Combine all fields into one searchable string
      return Object.values(item).some(val => {
        return safe(val).toLowerCase().includes(lowerQuery);
      });
    });

    renderTable(filtered);
  }

  // Initial render
  renderTable(providerData);

  // Event: live search
  searchInput.addEventListener('input', (e) => {
    filterData(e.target.value);
  });

  // Clear search
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    filterData('');
    searchInput.focus();
  });

  // Optional: search on Enter (not needed but prevents accidental form behavior)
  searchInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
    }
  });

  // Add small highlight for search (optional, but not needed)
</script>
